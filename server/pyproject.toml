[project]
name = "querybot-server"
version = "0.1.0"
description = "QueryBot Flask Server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.0",
    "flask-sqlalchemy>=3.1.1",
    "flask-migrate>=4.0.5",
    "flask-jwt-extended>=4.6.0",
    "flask-cors>=4.0.0",
    "marshmallow>=3.20.1",
    "bcrypt>=4.1.2",
    "python-dotenv>=1.0.0",
    "psycopg2-binary>=2.9.9",
    "langgraph-sdk>=0.2.9",
    "requests>=2.32.0",
    "gunicorn>=23.0.0",
    "gevent>=24.11.1",
    "redis>=5.2.0",
    "flask-limiter[redis]>=3.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
# The application package lives at the project root, not in src/.
pythonpath = ["."]
testpaths = ["tests"]
