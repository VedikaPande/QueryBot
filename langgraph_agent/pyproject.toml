[project]
name = "langgraph-agent"
version = "0.1.0"
description = "SQL Query Bot with Data Visualization Agent built with LangGraph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0.4",
    # One integration per supported LLM_PROVIDER. All four are installed so the
    # provider is a runtime choice; llm_manager imports only the one in use.
    "langchain-groq>=1.0.0",
    "langchain-openai>=1.0.0",
    "langchain-anthropic>=1.0.0",
    "langchain-google-genai>=3.0.0",
    "langgraph>=1.0.2",
    "langgraph-cli[inmem]>=0.4.7",
    "python-dotenv>=1.2.1",
    "typing-extensions>=4.15.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "langgraph-cli[inmem]>=0.4.7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
