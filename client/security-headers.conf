# Security headers, kept in a separate file so they can be included into every
# location that defines its own `add_header`.
#
# nginx's add_header does not merge: a directive at a lower level REPLACES the
# entire inherited set. Declaring these once at server level silently dropped
# them from any location that set its own Cache-Control, which is exactly the
# main document. Including the file makes that impossible to get wrong.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# 'unsafe-inline' for styles is required because Tailwind injects them.
# data: and blob: images are required because charts arrive as base64 PNGs and
# exports are produced as blobs.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
