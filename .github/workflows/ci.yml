name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push supersedes an in-flight run for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'

jobs:
  # ---------------------------------------------------------------------------
  # Only run a service's job when that service changed. Keeps PR feedback fast
  # without losing coverage, since main always runs everything.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.filter.outputs.client }}
      server: ${{ steps.filter.outputs.server }}
      sqlite: ${{ steps.filter.outputs.sqlite }}
      agent: ${{ steps.filter.outputs.agent }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            client:
              - 'client/**'
              - '.github/workflows/ci.yml'
            server:
              - 'server/**'
              - '.github/workflows/ci.yml'
            sqlite:
              - 'sqlite_server/**'
              - '.github/workflows/ci.yml'
            agent:
              - 'langgraph_agent/**'
              - '.github/workflows/ci.yml'
            docker:
              - '**/Dockerfile'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'

  client:
    name: Client
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      # `ci`, not `install`: fails if the lockfile is out of step with the
      # manifest instead of quietly resolving something different from local.
      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: client-coverage
          path: client/coverage/
          retention-days: 7

  sqlite-service:
    name: SQLite service
    needs: changes
    if: needs.changes.outputs.sqlite == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sqlite_server
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: sqlite_server/package-lock.json

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  server:
    name: Flask API
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    # Exercised against the same engines used in production, so dialect
    # differences surface in CI rather than after deploy.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: querybot
          POSTGRES_PASSWORD: querybot
          POSTGRES_DB: querybot_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports: ['5432:5432']
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - name: Install
        run: uv sync --frozen --all-groups

      - name: Test
        run: uv run pytest -v --tb=short

      - name: Verify migrations apply to PostgreSQL
        # Autogenerated migrations are written against SQLite locally; this
        # proves they also apply cleanly to the production engine.
        env:
          DATABASE_URL: postgresql://querybot:querybot@localhost:5432/querybot_test
          SECRET_KEY: ci-secret-key-not-used-in-production
          JWT_SECRET_KEY: ci-jwt-secret-not-used-in-production
        run: |
          uv run flask --app main.py db upgrade
          uv run flask --app main.py db downgrade base
          uv run flask --app main.py db upgrade

      - name: Fail if a model change has no migration
        env:
          DATABASE_URL: postgresql://querybot:querybot@localhost:5432/querybot_test
          SECRET_KEY: ci-secret-key-not-used-in-production
          JWT_SECRET_KEY: ci-jwt-secret-not-used-in-production
        run: |
          uv run flask --app main.py db check

  agent:
    name: LangGraph agent
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: langgraph_agent
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: langgraph_agent/uv.lock

      - name: Install
        run: uv sync --frozen --all-groups

      - name: Test
        env:
          # Never reaches a provider: every test either stubs the model or only
          # exercises code that does not call one.
          GROQ_API_KEY: test-key-unused
          CHART_DOCKER_ENABLED: 'false'
        run: uv run pytest -v --tb=short

      - name: Verify the graph compiles
        env:
          GROQ_API_KEY: test-key-unused
          CHART_DOCKER_ENABLED: 'false'
        run: uv run python -c "import main; print('graph OK')"

  docker:
    name: Docker images
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: client, context: ./client }
          - { name: server, context: ./server }
          - { name: sqlite-service, context: ./sqlite_server }
          - { name: agent, context: ./langgraph_agent }
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: querybot-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  compose:
    name: Stack smoke test
    needs: [changes, docker]
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate the compose file
        run: docker compose config --quiet
        env:
          GROQ_API_KEY: ci
          SECRET_KEY: ci
          JWT_SECRET_KEY: ci
          SERVICE_TOKEN: ci
          POSTGRES_PASSWORD: ci

  # A single required check, so branch protection does not need updating each
  # time a job is added or a path filter skips one.
  ci:
    name: CI
    needs: [client, sqlite-service, server, agent, docker, compose]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify no job failed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "Job results: $results"
          for result in $results; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::A required job did not succeed."
              exit 1
            fi
          done
          echo "All jobs succeeded or were skipped."
